<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>zeroxf 工具箱 · 海报</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:452px; overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
    background:#0b1020; color:#e8ecf5;
    background-image:
      radial-gradient(circle at 12% 10%, rgba(56,132,255,.30), transparent 48%),
      radial-gradient(circle at 88% 95%, rgba(0,209,178,.20), transparent 48%),
      linear-gradient(160deg,#0b1020 0%,#111a33 62%,#0d1428 100%);
    position:relative;
  }
  /* 网格底纹 */
  .grid {
    position:absolute; inset:0; opacity:.16;
    background-image:linear-gradient(rgba(120,170,255,.35) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(120,170,255,.35) 1px,transparent 1px);
    background-size:56px 56px;
    mask-image:linear-gradient(180deg,#000 0%,transparent 72%);
  }
  .wrap {
    position:relative; padding:58px 76px; height:100%;
    display:flex; flex-direction:column; justify-content:center;
  }

  .brand { display:flex; align-items:center; gap:22px; margin-bottom:46px; }
  .logo {
    width:92px; height:92px; border-radius:24px; flex:none;
    background:linear-gradient(135deg,#3b82f6,#22d3ee);
    display:flex; align-items:center; justify-content:center;
    font-size:46px; font-weight:800; color:#08101f;
    box-shadow:0 16px 44px rgba(59,130,246,.45);
  }
  .brand h1 { font-size:60px; font-weight:800; letter-spacing:-1px; line-height:1.05; }
  .brand .sub { font-size:23px; color:#8fa6c9; margin-top:10px; letter-spacing:.5px; }

  .stats { display:flex; gap:20px; }
  .stat {
    flex:1; background:rgba(255,255,255,.05); border:1px solid rgba(120,170,255,.20);
    border-radius:20px; padding:26px 24px;
  }
  .stat .n { font-size:52px; font-weight:800; line-height:1;
             background:linear-gradient(135deg,#60a5fa,#22d3ee);
             -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .stat .l { font-size:19px; color:#93a8c8; margin-top:12px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">

    <div class="brand">
      <div class="logo">Z</div>
      <div>
        <h1>zeroxf 工具箱</h1>
        <div class="sub">AI 版 · 图形界面 / 命令行 / MCP 三入口</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="n">63</div><div class="l">集成工具</div></div>
      <div class="stat"><div class="n">56</div><div class="l">AI 可直接调用</div></div>
      <div class="stat"><div class="n">9</div><div class="l">能力分类</div></div>
      <div class="stat"><div class="n">2</div><div class="l">平台一致可用</div></div>
    </div>

  </div>
</body>
</html>
